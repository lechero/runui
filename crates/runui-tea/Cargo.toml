[package]
name = "runui-tea"
description = "The terminal runtime, styles and widgets the interface is drawn with"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
crossterm.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The poll reader supports /dev/tty in shell widgets; kqueue cannot register
# every controlling-terminal descriptor on macOS.
crossterm = { workspace = true, features = ["use-dev-tty"] }

[lints]
workspace = true
