[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/lechero/runui"
rust-version = "1.88"

[workspace.dependencies]
# the crates here, one a Go package of runui
runui-core = { path = "crates/runui-core" }
runui-tea = { path = "crates/runui-tea" }
runui-project = { path = "crates/runui-project" }
runui-favorites = { path = "crates/runui-favorites" }
runui-runs = { path = "crates/runui-runs" }
runui-tui = { path = "crates/runui-tui" }

# from crates.io
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29.0", features = ["bracketed-paste"] }
libc = "0.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-segmentation = "1.13.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# the Go code's shapes, kept: long argument lists and big structs read
# the way runui's do
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
new_without_default = "allow"
module_inception = "allow"

[profile.release]
lto = "thin"
strip = true
